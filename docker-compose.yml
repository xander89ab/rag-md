services:
  # ------------------------------------------------------------
  # Единая точка входа:
  # - интерфейс RAG-MD;
  # - статические CSS/JS;
  # - PHP через PHP-FPM;
  # - проверка авторизации через Tinyauth;
  # - проксирование запросов в FastAPI.
  # ------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./frontend:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rag-proxy.conf:/etc/nginx/snippets/rag-proxy.conf:ro

    depends_on:
      - php
      - rag
      - tinyauth

    networks:
      - rag_net


  # ------------------------------------------------------------
  # Обработка PHP-страниц интерфейса.
  # ------------------------------------------------------------
  php:
    image: php:8.4-fpm-alpine
    restart: unless-stopped

    volumes:
      - ./frontend:/var/www/html:ro

    command:
      - php-fpm
      - -F
      - -d
      - opcache.enable=0

    networks:
      - rag_net


  # ------------------------------------------------------------
  # Авторизация.
  # Пользователи и bcrypt-хеши передаются из .env.
  # Наружу порт контейнера не публикуется.
  # ------------------------------------------------------------
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    restart: unless-stopped

    environment:
      TINYAUTH_APPURL: "${TINYAUTH_APP_URL:?Set TINYAUTH_APP_URL in .env}"

      TINYAUTH_AUTH_USERS: "${TINYAUTH_USERS:?Set TINYAUTH_USERS in .env}"
      TINYAUTH_AUTH_SECURECOOKIE: "${TINYAUTH_SECURE_COOKIE:-false}"

      TINYAUTH_AUTH_SESSIONEXPIRY: "28800"
      TINYAUTH_AUTH_SESSIONMAXLIFETIME: "86400"

      TINYAUTH_AUTH_LOGINMAXRETRIES: "5"
      TINYAUTH_AUTH_LOGINTIMEOUT: "300"

      TINYAUTH_DATABASE_DRIVER: "sqlite"
      TINYAUTH_DATABASE_PATH: "/data/tinyauth.db"

      TINYAUTH_LABELPROVIDER: "none"
      TINYAUTH_ANALYTICS_ENABLED: "false"

      TINYAUTH_UI_TITLE: "RAG-MD — вход"
      TINYAUTH_UI_FORGOTPASSWORDMESSAGE: "Обратитесь к администратору RAG-MD."

    volumes:
      - tinyauth_data:/data

    networks:
      - rag_net


  # ------------------------------------------------------------
  # Python RAG:
  # извлечение текста, OCR, эмбеддинги, поиск и генерация.
  # Доступ снаружи только через Nginx.
  # ------------------------------------------------------------
  rag:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "8000"

    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_URL: "http://ollama:11434"

      EMBED_MODEL: "${EMBED_MODEL:-intfloat/multilingual-e5-small}"
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:3b-instruct}"
      COLLECTION: "${COLLECTION:-normative_docs_v2}"

      DOCS_DIR: "/data/docs"
      PROCESSED_DIR: "/data/processed"

      TORCH_THREADS: "${TORCH_THREADS:-4}"
      EMBED_BATCH_SIZE: "${EMBED_BATCH_SIZE:-8}"

      OMP_NUM_THREADS: "${TORCH_THREADS:-4}"
      MKL_NUM_THREADS: "${TORCH_THREADS:-4}"
      TOKENIZERS_PARALLELISM: "false"

      HF_HOME: "/data/huggingface"

    volumes:
      - ./docs:/data/docs
      - ./processed:/data/processed
      - huggingface_cache:/data/huggingface

    depends_on:
      - qdrant
      - ollama

    networks:
      - rag_net


  # ------------------------------------------------------------
  # Векторная база.
  # Диагностический HTTP-порт доступен только с LXC-хоста.
  # ------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.3
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - ./qdrant_storage:/qdrant/storage

    networks:
      - rag_net


  # ------------------------------------------------------------
  # Локальная LLM.
  # Порт Ollama наружу не публикуется.
  # ------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    environment:
      OLLAMA_KEEP_ALIVE: "5m"

    volumes:
      - ollama_models:/root/.ollama

    networks:
      - rag_net


# --------------------------------------------------------------
# Постоянные данные.
# --------------------------------------------------------------
volumes:
  ollama_models:
  huggingface_cache:
  tinyauth_data:


# --------------------------------------------------------------
# Общая внутренняя сеть.
# --------------------------------------------------------------
networks:
  rag_net:
    driver: bridge