# Запросы на неизвестные имена, включая прямой вход по IP,
# не обслуживаем как RAG-MD.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}


# Публичная страница входа.
server {
    listen 80;
    server_name auth.example.test;

    server_tokens off;
    charset utf-8;

    client_max_body_size 1m;

    location / {
        proxy_pass http://tinyauth:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx здесь является непосредственной точкой входа.
        # Не доверяем X-Forwarded-For, присланному клиентом.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;

        proxy_intercept_errors off;
    }
}


# Защищённый RAG-MD.
server {
    listen 80;
    server_name rag.example.test;

    server_tokens off;

    root /var/www/html;
    index index.php;
    charset utf-8;

    client_max_body_size 512m;
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Защита наследуется всеми обычными location.
    auth_request /_tinyauth_check;

    auth_request_set $tinyauth_location
        $upstream_http_x_tinyauth_location;

    # Для обычной навигации браузера — переход на вход.
    error_page 401 403 =302 $tinyauth_location;


    # Внутренняя проверка сессии.
    location = /_tinyauth_check {
    internal;
    auth_request off;

    proxy_pass http://tinyauth:3000/api/auth/nginx;
    proxy_http_version 1.1;

    # Проверка авторизации не должна получать тело PDF/POST.
    proxy_pass_request_body off;

    # Не передаём клиентские заголовки автоматически.
    # Ниже явно перечислен необходимый набор.
    proxy_pass_request_headers off;

    proxy_set_header Host tinyauth:3000;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";

    # Заголовки именно для Nginx AuthRequest.
    proxy_set_header X-Original-URL
        $scheme://$http_host$request_uri;

    proxy_set_header X-Original-Method $request_method;

    # Cookie нужна для проверки сессии.
    proxy_set_header Cookie $http_cookie;

    # Клиентский адрес задаёт наш Nginx.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_connect_timeout 15s;
    proxy_read_timeout 15s;
	}


    location = / {
        rewrite ^ /index.php last;
    }


    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }


    # API не получает HTML страницы входа:
    # при отсутствии сессии возвращаем JSON.
    location /api/ {
        error_page 401 = @auth_required;
        error_page 403 = @access_denied;

        include /etc/nginx/snippets/rag-proxy.conf;
        proxy_pass http://rag:8000;
    }


    location = /upload {
        error_page 401 = @auth_required;
        error_page 403 = @access_denied;

        include /etc/nginx/snippets/rag-proxy.conf;
        proxy_pass http://rag:8000;
    }


    location = /ask {
        error_page 401 = @auth_required;
        error_page 403 = @access_denied;

        include /etc/nginx/snippets/rag-proxy.conf;
        proxy_pass http://rag:8000;
    }


    location = /reindex {
        error_page 401 = @auth_required;
        error_page 403 = @access_denied;

        include /etc/nginx/snippets/rag-proxy.conf;
        proxy_pass http://rag:8000;
    }


    location /reindex-file/ {
        error_page 401 = @auth_required;
        error_page 403 = @access_denied;

        include /etc/nginx/snippets/rag-proxy.conf;
        proxy_pass http://rag:8000;
    }


    location @auth_required {
        auth_request off;

        default_type application/json;
        add_header Cache-Control "no-store" always;

        return 401 '{"detail":"Требуется вход. Откройте главную страницу RAG-MD и авторизуйтесь."}';
    }


    location @access_denied {
        auth_request off;

        default_type application/json;
        add_header Cache-Control "no-store" always;

        return 403 '{"detail":"Доступ запрещён."}';
    }


    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;

        fastcgi_pass php:9000;

        fastcgi_connect_timeout 15s;
        fastcgi_read_timeout 60s;
    }


    location ~ /\. {
        deny all;
    }


    location / {
        try_files $uri $uri/ =404;
    }
}